version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: arvind_postgres_db
    environment:
      POSTGRES_DB: arvind_quality_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arvind_quality_tracker
    ports:
      - "3000:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - JWT_SECRET=arvind_fabric_quality_tracker_secret_key_2026
      - DB_DIALECT=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=arvind_quality_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
